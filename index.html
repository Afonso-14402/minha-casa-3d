<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Desenha a tua casa em 3D: paredes, portas, janelas, chão, cores e móveis. Depois passeia lá dentro.">
<title>Minha Casa 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 11 12 3l9 8v10H3z' fill='%232d55d6'/%3E%3Cpath d='M9.5 21v-6h5v6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand float"><b>Minha Casa</b><span>3D</span></div>
    <div class="stats float" aria-live="polite">
      <span><b id="s-area">0</b> m² interiores</span>
      <span><b id="s-rooms">0</b> divisões</span>
      <span><b id="s-walls">0</b> m de parede</span>
      <span><b id="s-items">0</b> móveis</span>
    </div>
    <div class="spacer"></div>
    <div class="bar float">
      <button class="ib" id="b-undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ib" id="b-redo" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="ib" id="b-cut" aria-pressed="false" title="Baixar as paredes para ver o interior"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20v-6h14v6M5 10V4M19 10V4" stroke-dasharray="2 2.5"/></svg><span class="lbl-hide">Paredes baixas</span></button>
      <label class="time" title="Hora do dia"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><input id="time" type="range" min="6" max="23" step="0.25" value="16" aria-label="Hora do dia"><output id="time-out">16:00</output></label>
      <button class="ib" id="b-menu" aria-expanded="false" aria-haspopup="true">Casa<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </header>
  <div class="menu float" id="menu" hidden>
    <button data-menu="example">Casa de exemplo<small>Abre a casa já mobilada</small></button>
    <button data-menu="clear">Começar do zero<small>Terreno vazio. Podes desfazer.</small></button>
    <button data-menu="code">Código da casa<small>Guardar, partilhar ou abrir</small></button>
  </div>
  <nav class="tools float" id="tools" aria-label="Ferramentas"></nav>
  <aside class="panel float" id="panel" aria-label="Opções da ferramenta"></aside>
  <div class="hint"><span class="float" id="hint"></span></div>
  <div class="measure" id="measure" hidden></div>
  <div class="toast float" id="toast" hidden></div>
  <div class="walkpad" id="walkpad" hidden>
    <span></span><button data-k="KeyW" aria-label="Andar para a frente">▲</button><span></span>
    <button data-k="TurnL" aria-label="Rodar para a esquerda">⟲</button><button data-k="KeyS" aria-label="Andar para trás">▼</button><button data-k="TurnR" aria-label="Rodar para a direita">⟳</button>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-labelledby="code-title">
      <h2 id="code-title">Código da casa</h2>
      <p>Este código guarda a casa toda: paredes, chão, cores e móveis. Copia-o para o guardar ou mandar a alguém. Para abrir outra casa, cola aqui o código dela.</p>
      <textarea id="code" spellcheck="false" aria-label="Código da casa"></textarea>
      <div class="actions">
        <button class="btn primary" id="code-copy">Copiar código</button>
        <button class="btn" id="code-load">Abrir este código</button>
        <button class="btn" id="code-close">Fechar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="casa.js"></script>
</body>
</html>
